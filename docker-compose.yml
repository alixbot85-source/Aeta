services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aeta
      POSTGRES_PASSWORD: aeta
      POSTGRES_DB: aeta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeta -d aeta"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    env_file: .env
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://aeta:aeta@postgres:5432/aeta?schema=public
      REDIS_URL: redis://redis:6379
      WORKSPACES_ROOT: /data/workspaces
      API_CORS_ORIGIN: http://localhost:3000
      PUBLIC_WEB_URL: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - workspace-data:/data/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    environment:
      WEB_PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  sandbox:
    build:
      context: .
      dockerfile: infra/sandbox/Dockerfile
    command: ["sleep", "infinity"]
    network_mode: none
    cpus: 1.0
    mem_limit: 1g
    volumes:
      - workspace-data:/data/workspaces
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:
  workspace-data:
